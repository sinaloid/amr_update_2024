# Configuration Nginx pour le reverse proxy vers l'application Docker
# À placer dans /etc/nginx/sites-available/edic.conf

server {
    listen 80;
    server_name amrburkina.org www.amrburkina.org; # Remplacez par votre nom de domaine

    # Configuration des logs
    error_log /var/log/nginx/amrburkina_error.log;
    access_log /var/log/nginx/amrburkina_access.log;

    # Reverse proxy vers le container Docker
    location / {
        proxy_pass http://localhost:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Configuration des timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer configuration
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Gestion des erreurs de proxy
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

