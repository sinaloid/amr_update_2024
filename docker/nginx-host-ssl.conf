# Configuration Nginx pour le reverse proxy vers l'application Docker EDIC
# Version corrigée pour SSL avec Certbot

# Bloc HTTPS (SSL)
server {
    listen 443 ssl http2;
    server_name edic-municipalities.com www.edic-municipalities.com;

    # Configuration SSL gérée par Certbot
    ssl_certificate /etc/letsencrypt/live/edic-municipalities.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edic-municipalities.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Configuration des logs
    error_log /var/log/nginx/edic_error.log;
    access_log /var/log/nginx/edic_access.log;

    # Gestion spécifique des fichiers statiques (CSS, JS, images)
    location ~* \.(css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|ico)$ {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Cache des fichiers statiques
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        # Configuration des timeouts pour les assets
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Reverse proxy pour toutes les autres requêtes
    location / {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Configuration des timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer configuration
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gestion des erreurs de proxy
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name edic-municipalities.com www.edic-municipalities.com;
    
    # Redirection permanente vers HTTPS
    return 301 https://$server_name$request_uri;
}